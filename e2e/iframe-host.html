<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>受限 iframe 測試宿主</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      iframe { border: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- 刻意不給 allow-pointer-lock，模擬受限的預覽環境 -->
    <iframe id="game" sandbox="allow-scripts allow-same-origin" src="/?dev=1&gfx=low"></iframe>
  </body>
</html>
